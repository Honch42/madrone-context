<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrone Context</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="drag-region"></div>

    <div class="brand-header" style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 1001; pointer-events: none; -webkit-app-region: no-drag;">
        <img src="/static/assets/logo.png" alt="Madrone" style="width: 28px; height: 28px; border-radius: 6px; opacity: 0.7;">
        <span style="color: rgba(255,255,255,0.4); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px;">MADRONE</span>
    </div>

    <div class="top-bar" style="position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; color: var(--text-secondary); font-size: 0.9rem; z-index: 1001; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; pointer-events: auto; -webkit-app-region: no-drag;">
        <button id="settings-btn" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 0.9rem;">
            ⚙ Settings
        </button>
        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
            Model
            <select id="model-select" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9rem;">
                <option value="gemini-3.6-flash" style="color: black;">Gemini 3.6 Flash (Video Aware)</option>
                <option value="gemini-3.1-pro" style="color: black;">Gemini 3.1 Pro (Video Aware)</option>
                <option value="claude-3-5-sonnet" style="color: black;">Claude 3.5 Sonnet (Hybrid)</option>
                <option value="claude-fable" style="color: black;">Claude Fable (Hybrid)</option>
                <option value="gpt-4o" style="color: black;">GPT-4o (Hybrid)</option>
                <option value="gpt-4o-mini" style="color: black;">GPT-4o-mini (Hybrid)</option>
            </select>
        </label>
        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
            Persona
            <select id="persona-select" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9rem;">
                <option value="socratic" style="color: black;">Socratic Method (Default)</option>
                <option value="5whys" style="color: black;">5-Whys Deep Dive</option>
                <option value="grow" style="color: black;">GROW Coaching Model</option>
                <option value="empathetic" style="color: black;">Empathetic Listener</option>
            </select>
        </label>
    </div>
    


    <div class="container">
        <!-- User Transcript Prompt -->
        <div id="transcript-display" style="color: var(--text-secondary); font-size: 1.2rem; margin-bottom: 20px; font-style: italic; min-height: 1.5rem;">
        </div>

        <!-- AI Question Prompt -->
        <div id="question-display" class="question-text">
            Initializing AI Brain...
        </div>

        <div class="status-bar">
            <div id="status-indicator" class="status-listening">
                <span class="dot"></span> <span id="status-text">CONNECTING...</span>
            </div>
            
            <div class="controls-hint">
                <span class="key">Spacebar</span> Finish Speaking &nbsp;&nbsp;
                <span class="key">Shift+Esc</span> Freeze &nbsp;&nbsp;
                <span class="key">Cmd+Enter</span> Conclude
            </div>
        </div>
        
        <video id="hidden-video" autoplay muted playsinline style="display: none;"></video>
    </div>

    <div id="start-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; background-color: var(--bg-color);">
        <img src="/static/assets/logo.png" alt="Madrone" style="width: 100px; height: 100px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h1 style="color: white; font-size: 2rem; margin-bottom: 20px;">Context Platform Ready</h1>
        <p style="color: var(--text-secondary); margin-bottom: 40px; font-size: 1rem;">Click below to connect to the orchestrator.</p>
        <button id="btn-start" style="padding: 15px 30px; font-size: 1.2rem; background-color: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s;">Begin Session</button>
    </div>

    <!-- Review Dialog -->
    <div id="review-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 501; background-color: rgba(10, 10, 10, 0.95); padding: 40px; box-sizing: border-box;">
        <h2 style="color: white; font-size: 2rem; margin-bottom: 30px;">Session Summary & Analysis</h2>
        
        <div style="display: flex; gap: 40px; width: 90%; max-width: 1200px; height: 60vh; margin-bottom: 30px;">
            <!-- Left Column: Summary -->
            <div style="flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 12px;">
                <h3 style="color: white; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Context Summary</h3>
                <div id="review-text" style="color: var(--text-secondary); font-size: 1rem; overflow-y: auto; line-height: 1.6; text-align: left; white-space: pre-wrap; flex: 1;"></div>
            </div>
            
            <!-- Right Column: Insights & Synergy -->
            <div style="flex: 1; display: flex; flex-direction: column; background: rgba(0, 122, 255, 0.05); border: 1px solid rgba(0, 122, 255, 0.2); padding: 30px; border-radius: 12px; overflow-y: auto;">
                <h3 style="color: #007aff; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 122, 255, 0.2); padding-bottom: 10px;">Video Insights</h3>
                <div id="review-insights" style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; text-align: left; white-space: pre-wrap; margin-bottom: 30px;"></div>
                
                <h3 style="color: #bf5af2; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(191, 90, 242, 0.2); padding-bottom: 10px;">Behavioral Alignment</h3>
                <div id="review-synergy" style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; text-align: left; white-space: pre-wrap; flex: 1;"></div>
            </div>
        </div>
        
        <div style="display: flex; gap: 20px;">
            <button id="btn-discard" style="padding: 15px 30px; font-size: 1.1rem; background-color: transparent; color: #ff453a; border: 1px solid #ff453a; border-radius: 8px; cursor: pointer; transition: background-color 0.2s;">Discard Session</button>
            <button id="btn-investigate" style="padding: 15px 30px; font-size: 1.1rem; background-color: #bf5af2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; box-shadow: 0 4px 14px rgba(191, 90, 242, 0.4);">Investigate Discrepancies</button>
            <button id="btn-save" style="padding: 15px 30px; font-size: 1.1rem; background-color: #34c759; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; box-shadow: 0 4px 14px rgba(52, 199, 89, 0.4);">Save to Dossier</button>
        </div>
    </div>

    <script src="/static/app.js?v=22"></script>
</body>
</html>
